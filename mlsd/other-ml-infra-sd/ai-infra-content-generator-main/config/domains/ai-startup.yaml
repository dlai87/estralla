{
  "org": "ai-startup-curriculum",
  "default_remote": "git@github.com:ai-startup-curriculum/{repo}.git",
  "release": {
    "tag_format": "v%Y.%m",
    "branch": "main",
    "package_workflow": "release-package.yml"
  },
  "quality_judge": {
    "enabled": true,
    "flag_only": true,
    "agent_command": "{runner}/scripts/run-claude-judge.sh --prompt {prompt} --output-dir {output_dir} --repo {repo} --work-id {work_id} --artifact {artifact}",
    "thresholds": {
      "default": 70,
      "freshness": 72
    },
    "dimensions": [
      "correctness",
      "clarity",
      "source_quality",
      "depth"
    ],
    "timeout_seconds": 300,
    "freshness_cooldown_days": 90
  },
  "pipeline": {
    "phases": {
      "author": true,
      "reaudit_autofix": false,
      "research_autopromote": false,
      "retire": false,
      "package": false
    },
    "daily_budget": 8,
    "rotation_days": 90,
    "reaudit_slice": 30
  },
  "extra_repos": [
    {
      "name": ".github",
      "kind": "org-profile",
      "release": false
    }
  ],
  "maintained_by": {
    "_comment": "Project maintainership attribution. Used by aicg org rebrand to write the footer, and by the audits to treat references to these orgs as legitimate (not 'orphan'). Distinct from the source policy for curriculum content — those rules are unchanged.",
    "name": "VeriSwarm.ai",
    "url": "https://veriswarm.ai",
    "phrasing": "Maintained by [VeriSwarm.ai](https://veriswarm.ai)",
    "footer_marker": "<!-- aicg:maintained-by -->"
  },
  "documentation": {
    "format_guard_files": [
      "CURRICULUM.md",
      "CURRICULUM_INDEX.md",
      "README.md",
      "VERSIONS.md"
    ],
    "org_readme_repo": ".github",
    "org_readme_files": [
      "README.md",
      "profile/README.md"
    ]
  },
  "schedules": {
    "monthly_release": "0 2 1 * *",
    "monthly_research": "30 5 1 3,6,9,12 *",
    "weekly_audit": "0 3 * * 0",
    "daily_remediate": "0 * * * *",
    "daily_issues": "20 4 * * *",
    "daily_steward": "40 4 * * *",
    "daily_discussions": "0 5 * * *",
    "monthly_review": "0 6 1 3,6,9,12 *"
  },
  "automation": {
    "state_dir": ".aicg/org",
    "lock_name": "aicg-org.lock",
    "auto_merge": false,
    "max_daily_work_items": 1,
    "_comment_daily_drain": "True = drain queue per tick until empty / wall-clock cap; False = exactly one item per tick.",
    "daily_drain": false,
    "agent": {
      "provider": "openai",
      "model": "codex-gpt-5.5",
      "interface": "local_cli_subscription",
      "agent_command": "{runner}/scripts/run-codex-control.sh --model codex-gpt-5.5 --prompt {prompt} --output-dir {output_dir} --repo {repo} --work-id {work_id}",
      "purpose": "repo orchestration, audits, validation, PR/issue/discussion stewardship, and scheduler control"
    }
  },
  "content_generation": {
    "agent": {
      "provider": "anthropic",
      "model": "claude-opus-4-7",
      "interface": "local_cli_subscription",
      "purpose": "curriculum, exemplar-artifact, job-requirement, and supplemental content generation",
      "agent_command": "{runner}/scripts/run-claude-content.sh --model claude-opus-4-7 --prompt {prompt} --output-dir {output_dir} --repo {repo} --work-id {work_id}"
    }
  },
  "job_requirements": {
    "ownership_strategy": "lowest_level_role",
    "markdown_file": "JOB_REQUIREMENTS.md",
    "structured_file": ".aicg/job-requirements.json",
    "supplemental_dir": "supplemental"
  },
  "research": {
    "agent": {
      "provider": "anthropic",
      "model": "claude-opus-4-7",
      "interface": "local_cli_subscription",
      "purpose": "quarterly startup-role/functional research with web tools enabled",
      "agent_command": "{runner}/scripts/run-claude-research.sh --model claude-opus-4-7 --prompt {prompt} --output-dir {output_dir} --repo {repo} --work-id {work_id}"
    },
    "minimum_postings_per_role": 25,
    "source_window_days": 90,
    "caps": {
      "_comment": "Per role, per research run. Anything above the cap is rejected with a 'cap_exceeded' reason and surfaced in the proposal PR so a human can decide whether to raise the cap or trim the list.",
      "max_modules_per_run": 1,
      "max_exercises_per_run": 3,
      "max_projects_per_run": 0
    },
    "min_evidence_count": 3,
    "min_evidence_window_days": 90
  },
  "_roles_comment": "Startup domain uses single-repo curricula (repo_model: single). `level` is a path/order index for the three-axis model (functional curricula x role pathways x stage tags), NOT a seniority ladder — a founding PM is not 'junior' to a CTO here.",
  "roles": [
    {
      "id": "startup-foundations",
      "title": "Startup Foundations",
      "level": 10,
      "repo_model": "single",
      "learning_repo": "startup-foundations",
      "aliases": [
        "Startup Fundamentals",
        "How Startups Work",
        "Founder Fundamentals",
        "Company Building Basics"
      ]
    },
    {
      "id": "founder-ceo",
      "title": "Founder / CEO",
      "level": 20,
      "repo_model": "single",
      "learning_repo": "founder-ceo-curriculum",
      "aliases": [
        "Founder",
        "Startup CEO",
        "Founding CEO",
        "Solo Founder",
        "Co-Founder & CEO",
        "Founder & CEO"
      ]
    },
    {
      "id": "cto",
      "title": "Co-Founder / CTO",
      "level": 25,
      "repo_model": "single",
      "learning_repo": "cto-curriculum",
      "aliases": [
        "Startup CTO",
        "Technical Co-Founder",
        "Founding Engineer",
        "VP Engineering (startup)",
        "Head of Engineering (startup)",
        "Co-Founder & CTO"
      ]
    },
    {
      "id": "startup-product-gtm",
      "title": "Startup Product & GTM",
      "level": 30,
      "repo_model": "single",
      "learning_repo": "startup-product-gtm-curriculum",
      "aliases": [
        "Founding Product Manager",
        "Head of Product (early-stage)",
        "Founding GTM",
        "Head of Growth (startup)",
        "Founding Sales & Marketing",
        "Chief Product Officer (startup)"
      ]
    },
    {
      "id": "cpo",
      "title": "Founding CPO / Head of Product",
      "level": 35,
      "repo_model": "single",
      "learning_repo": "cpo-curriculum",
      "aliases": [
        "Chief Product Officer (startup)",
        "Founding Product Manager",
        "Head of Product (early-stage)",
        "VP Product (startup)",
        "Founding Product Lead"
      ]
    },
    {
      "id": "startup-finance-fundraising",
      "title": "Startup Finance & Fundraising",
      "level": 40,
      "repo_model": "single",
      "learning_repo": "startup-finance-fundraising-curriculum",
      "aliases": [
        "Startup CFO",
        "Head of Finance (startup)",
        "Fundraising Lead",
        "Head of Fundraising",
        "Founder (fundraising)"
      ]
    },
    {
      "id": "startup-operations-governance",
      "title": "Startup Operations & Governance",
      "level": 50,
      "repo_model": "single",
      "learning_repo": "startup-operations-governance-curriculum",
      "aliases": [
        "Startup COO",
        "Head of Operations (startup)",
        "Chief of Staff (startup)",
        "Head of Corporate Governance",
        "Founding Operations"
      ]
    },
    {
      "id": "startup-exit",
      "title": "Startup Exit & Endgame",
      "level": 60,
      "repo_model": "single",
      "learning_repo": "startup-exit-curriculum",
      "aliases": [
        "Startup M&A",
        "Startup Acquisition",
        "IPO Readiness",
        "Founder Exit",
        "Secondaries & Liquidity",
        "Corporate Development (startup)"
      ]
    }
  ]
}
